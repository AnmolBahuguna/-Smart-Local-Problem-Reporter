# ============================================================
# Smart Problem Reporter — Spring Boot Application Properties
# ============================================================

# Server
server.port=8080
spring.application.name=smart-problem-reporter

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/smart_problem_reporter?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── File Upload ───────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/complaints

# ── Security ──────────────────────────────────────────────────
# JWT secret (replace with a strong secret in production!)
app.jwt.secret=SmartCivicReporter2026SecretKey!@#
app.jwt.expiration-ms=86400000

# ── Logging ───────────────────────────────────────────────────
logging.level.com.civicreport=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500
